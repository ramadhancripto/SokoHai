<!-- FOMU YA WAKALA KUSAJILI MWANACHAMA (OFFLINE) — NJIA YA WAKALA (server) -->
<form id="offlineMemberForm" class="form-box">
    <h3> Sajili Mwanachama</h3>

    <label style="font-size:11px; font-weight:bold; color:gray;">JINA KAMILI LA MWANACHAMA *</label>
    <input type="text" id="offName" placeholder="Mfano: Mama Asha" required>

    <div style="display:flex; gap:10px;">
        <div style="flex:1;">
            <label style="font-size:11px; font-weight:bold; color:gray;">MKOA *</label>
            <input type="text" id="offRegion" placeholder="Mfano: Dodoma" required>
        </div>
        <div style="flex:1;">
            <label style="font-size:11px; font-weight:bold; color:gray;">WILAYA *</label>
            <input type="text" id="offDistrict" placeholder="Mfano: Kondoa" required>
        </div>
    </div>

    <label style="font-size:11px; font-weight:bold; color:gray;">AINA YA BIASHARA (Kama anayo)</label>
    <select id="offBusinessType" style="width:100%; padding:14px; margin-bottom:12px; border-radius:12px; border:1px solid #cbd5e1; background:white;">
        <option value="Sio Biashara">Mteja wa Kawaida pekee</option>
        <option value="Mama Ntilie">Chakula / Mama Ntilie</option>
        <option value="Duka la Rejareja">Duka la Rejareja</option>
        <option value="Gereji/Ufundi">Gereji au Ufundi</option>
        <option value="Mkulima">Kilimo / Mazao</option>
    </select>

    <!-- PIN YA MWANACHAMA — ANAIANDIKA MWENYEWE (server inahifadhi hash tu) -->
    <label style="font-size:11px; font-weight:bold; color:gray;">PIN YA MWANACHAMA (tarakimu 4–6) *</label>
    <input type="password" inputmode="numeric" maxlength="6" id="offPin" placeholder="•••••• (mwanachama aandike mwenyewe)"
        style="width:100%; padding:16px; margin-bottom:14px; border-radius:12px; border:2px solid #1268A8; text-align:center; font-size:22px; letter-spacing:8px; font-weight:900; outline:none; box-sizing:border-box;">
    <button type="button" id="btnOffline" onclick="registerOfflineMember()" style="width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 900; font-size: 15px; cursor: pointer; text-transform: uppercase; margin-top: 10px; background: var(--gold); color: var(--primary-dark); box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3);"> SAJILI MWANACHAMA</button>
    <button type="button" class="btn-close" onclick="goBackToMenu()">❮ Rudi Nyuma</button>
</form>
