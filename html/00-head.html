<script id="skhWordmarkGen">
/* [BRAND WORDMARK R15 2026-09-17] SokoHai kama SVG-logo (sio text).
   Chanzo kimoja — skhWordmark(w, {variant:'color'|'white', gid}).
   S | o | k | o(+mkia unaoishia H: K-O-H connection) | H | a=Cart | i(gold dot).
   Blue->Green gradient (#1268A8 -> #2B82BD -> #18A982), gold accent (#D8B83A). */
window.skhWordmark = function(w, opts){
    opts = opts || {};
    var gid = opts.gid || 'skhWmGrad' + (opts.variant === 'white' ? 'W' : 'C');
    var grad = opts.variant === 'white'
      ? '<linearGradient id="'+gid+'" x1="0" y1="0" x2="352" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9f0e6"/></linearGradient>'
      : '<linearGradient id="'+gid+'" x1="0" y1="0" x2="352" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#1268A8"/><stop offset=".52" stop-color="#2B82BD"/><stop offset="1" stop-color="#18A982"/></linearGradient>';
    return '<svg width="'+w+'" height="'+Math.round(w*96/352)+'" viewBox="0 0 352 96" fill="none" stroke="url(#'+gid+')" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="SokoHai" xmlns="http://www.w3.org/2000/svg">'
      + '<defs>'+grad+'</defs>'
      + '<path stroke-width="14" d="M48 30 C44 24 33 22 25 25.5 C17 29 17.5 37.5 26 41 C32.5 43.7 41 46 45.6 50.8 C50.4 55.9 48.6 64.4 40.6 68 C32.8 71.5 20.6 70.8 14 64"/>'
      + '<circle cx="86" cy="53" r="16.5" stroke-width="13"/>'
      + '<path stroke-width="13" d="M117 22 V70 M142 40 L119.5 55.5 L145 70"/>'
      + '<circle cx="171" cy="52" r="16.5" stroke-width="13"/>'
      + '<path stroke-width="8" d="M180 65 C185.5 74.5 193.5 77 199 74"/>'
      + '<path stroke-width="13" d="M206 22 V70 M234 22 V70 M206 46 H234"/>'
      + '<path stroke-width="7.5" d="M249 37.5 l5 1.5 4.6 19 h24 l6.4 -14.5 h-25"/>'
      + '<circle cx="262.5" cy="64" r="3.6" stroke-width="7"/>'
      + '<circle cx="280" cy="64" r="3.6" stroke-width="7"/>'
      + '<path stroke-width="13" d="M309 46 V70"/>'
      + '<circle cx="309" cy="32" r="5" fill="#D8B83A" stroke="none"/>'
      + '</svg>';
};
/* Mounti: kila [data-skh-wm="<upana>"] hupata SVG moja — hakuna markup iliyodufu */
window.skhMountWordmarks = function(root){
    (root || document).querySelectorAll('[data-skh-wm]').forEach(function(el){
        var w = parseInt(el.getAttribute('data-skh-wm'), 10) || 132;
        var v = el.getAttribute('data-skh-wm-variant') || 'color';
        el.innerHTML = window.skhWordmark(w, { variant: v, gid: 'skhWmGrad_' + w + '_' + v });
    });
};
</script>
