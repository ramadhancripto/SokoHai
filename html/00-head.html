<script id="skhWordmarkGen">
/* Compatibility API: use the same cart mark and type lockup as the top nav. */
window.skhWordmark = function(w, opts){
    var width = Math.max(64, Math.min(500, Number(w) || 132));
    var white = opts && opts.variant === 'white';
    var fg = white ? ' style="color:#fff"' : '';
    return '<span class="skh-dynamic-brand" role="img" aria-label="SokoHai" style="display:inline-flex;align-items:center;gap:'+Math.round(width*.04)+'px;width:'+width+'px;line-height:1">'
      + '<img src="assets/img/sokohai-cart-mark.png" alt="" aria-hidden="true" style="width:24%;height:auto;object-fit:contain">'
      + '<span class="skh-brand-lockup" aria-hidden="true" style="flex:1;min-width:0;font-size:'+Math.round(width*.18)+'px">'
      + '<span class="skh-brand-word"><b class="skh-brand-soko"'+fg+'>Soko</b><b class="skh-brand-hai"'+fg+'>Hai</b></span><span class="skh-brand-arc"></span></span></span>';
};
window.skhMountWordmarks = function(root){
    (root || document).querySelectorAll('[data-skh-wm]').forEach(function(el){
        var w = parseInt(el.getAttribute('data-skh-wm'), 10) || 132;
        var v = el.getAttribute('data-skh-wm-variant') || 'color';
        el.innerHTML = window.skhWordmark(w, { variant: v });
    });
};
</script>
