<!-- USER PAYMENT SETTINGS MODAL (SMART FORM) -->
<div id="userPaymentModal" class="overlay-menu" style="z-index: 8750;">
    <div style="background:white; border-radius:24px; padding:30px; width:95%; max-width:420px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); animation: popIn 0.3s ease-out; max-height:90vh; overflow-y:auto;">
        <h3 style="color:var(--primary-dark); text-align:center; margin-top:0;"> Akaunti ya Malipo</h3>
        <p data-i18n="pay_hint" style="font-size:12px; color:#64748b; text-align:center; margin-bottom:20px;">Weka taarifa sahihi za benki au simu kwa kupokea pesa (Withdrawals) au kukatwa (Direct Auto-Pay).</p>
        
        <label style="font-size:12px; font-weight:bold; color:var(--primary-dark);">Aina ya Njia ya Malipo *</label>
        <select id="paySetupType" onchange="togglePaymentSetupFields()" style="width:100%; padding:14px; margin:5px 0 15px; border-radius:12px; border:1px solid #cbd5e1; outline:none; background:#f8fafc;">
            <option value="">-- Chagua --</option>
            <option value="Mobile"> Mtandao wa Simu (M-Pesa, Tigo, n.k)</option>
            <option value="Bank"> Akaunti ya Benki (CRDB, NMB, n.k)</option>
            <option value="Card"> Kadi ya Benki (Visa / Mastercard)</option>
        </select>

        <!-- SEHEMU YA MTANDAO WA SIMU -->
        <div id="setupMobileFields" style="display:none; background:#f0fdf4; padding:15px; border-radius:12px; border:1px solid #bbf7d0; margin-bottom:15px;">
            <label style="font-size:12px; font-weight:bold;">Mtandao *</label>
            <select id="setupMobileProvider" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1;">
                <option value="Mpesa">Vodacom M-Pesa</option>
                <option value="Tigo">Tigo Pesa</option>
                <option value="Airtel">Airtel Money</option>
                <option value="Halopesa">Halopesa</option>
            </select>
            <label style="font-size:12px; font-weight:bold;">Namba ya Simu *</label>
            <input type="tel" id="setupMobileNumber" placeholder="Mfano: 0712345678" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1;">
            <label style="font-size:12px; font-weight:bold;">Jina la Usajili la Laini *</label>
            <input type="text" id="setupMobileName" placeholder="Mf: JUMA ATHUMANI" style="width:100%; padding:12px; border-radius:8px; border:1px solid #cbd5e1; text-transform:uppercase;">
        </div>

        <!-- SEHEMU YA BENKI HALISI -->
        <div id="setupBankFields" style="display:none; background:#eff6ff; padding:15px; border-radius:12px; border:1px solid #bfdbfe; margin-bottom:15px;">
            <label style="font-size:12px; font-weight:bold;">Jina la Benki *</label>
            <select id="setupBankProvider" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1;">
                <option value="CRDB">CRDB Bank</option>
                <option value="NMB">NMB Bank</option>
                <option value="NBC">NBC Bank</option>
                <option value="KCB">KCB Bank</option>
                <option value="Equity">Equity Bank</option>
            </select>
            <label style="font-size:12px; font-weight:bold;">Namba ya Akaunti ya Benki (Account Number) *</label>
            <input type="number" id="setupBankNumber" placeholder="Mf: 0152XXXXX000" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1;">
            <label style="font-size:12px; font-weight:bold;">Jina la Akaunti (Account Name) *</label>
            <input type="text" id="setupBankName" placeholder="Mf: JUMA ATHUMANI K" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1; text-transform:uppercase;">
            <label style="font-size:12px; font-weight:bold;">Tawi (Branch Name) (Hiari)</label>
            <input type="text" id="setupBankBranch" placeholder="Mf: Azikiwe Branch" style="width:100%; padding:12px; border-radius:8px; border:1px solid #cbd5e1;">
        </div>

        <!-- SEHEMU YA KADI (KAMA ALIBABA) -->
        <div id="setupCardFields" style="display:none; background:#fef2f2; padding:15px; border-radius:12px; border:1px solid #fecaca; margin-bottom:15px;">
            <div style="text-align:center; font-size:24px; margin-bottom:10px;"></div>
            <label style="font-size:12px; font-weight:bold;">Namba ya Kadi (Card Number) *</label>
            <input type="tel" id="setupCardNumber" placeholder="XXXX XXXX XXXX XXXX" maxlength="19" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1;">
            
            <div style="display:flex; gap:10px;">
                <div style="flex:1;">
                    <label style="font-size:12px; font-weight:bold;">Muda wa Kuisha (MM/YY) *</label>
                    <input type="text" id="setupCardExpiry" placeholder="12/25" maxlength="5" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1;">
                </div>
                <div style="flex:1;">
                    <label style="font-size:12px; font-weight:bold;">CVV *</label>
                    <input type="password" id="setupCardCvv" placeholder="123" maxlength="3" style="width:100%; padding:12px; margin:5px 0 10px; border-radius:8px; border:1px solid #cbd5e1;">
                </div>
            </div>
            <label style="font-size:12px; font-weight:bold;">Jina Lililopo Kwenye Kadi *</label>
            <input type="text" id="setupCardName" placeholder="JUMA ATHUMANI" style="width:100%; padding:12px; border-radius:8px; border:1px solid #cbd5e1; text-transform:uppercase;">
            <p style="font-size: 12.5px; color:#ef4444; margin-top:5px; text-align:center;"> Taarifa za kadi zinalindwa na hazihifadhiwi waziwazi.</p>
        </div>



<!-- KITUFE CHA KU-UNLOCK FORM (EDIT) -->
        <button id="btnEditPaymentAccount" type="button" onclick="enableEditPaymentInfo()" style="display:none; width:100%; padding:16px; background:#eab308; color:white; border:none; border-radius:14px; font-weight:900; font-size:15px; cursor:pointer; transition: 0.3s; margin-bottom:10px;"><span class="skh-ico" data-ico="edit"></span> BADILI TAARIFA (EDIT)</button>
        
        <!-- KITUFE CHA KUSAVE (Kitafichwa kama form ipo Locked) -->
    
<!-- AKUNTI / MISTARI YA SOKOPAY YA USER -->
        <div style="background:#f8fafc; border:1px solid #cbd5e1; padding:15px; border-radius:18px; margin-top:15px; margin-bottom:15px; text-align:left;">
            <b style="font-size:12px; color:var(--primary-dark); display:block; margin-bottom:10px; border-bottom:1px solid #e2e8f0; padding-bottom:5px;"> SOKOPAY TRANSACTIONS (ESCROW)</b>
            <div id="userSokoPayList" style="max-height:180px; overflow-y:auto; font-size: 13px; display:flex; flex-direction:column; gap:8px;">
                <p style="color:gray; font-style:italic; text-align:center;">Inapakia miamala yako...</p>
            </div>
        </div>
        <button onclick="goBackToSidebar()" style="width:100%; padding:12px; background:#e2e8f0; color:#475569; border:none; border-radius:14px; cursor:pointer; font-weight:bold; transition: 0.3s;">&lsaquo; Rudi Kwenye Menu</button>
    </div>
</div>
