<!-- FOMU YA KUSAJILI CHOMBO (DEREVA) - REALTIME SYSTEM -->


<!-- FOMU YA KISASA NA YA KINA: SOKOHAI LOGISTICS INTELLIGENCE (TRANSPORTER) -->
<form id="deliveryForm" class="form-box" onsubmit="submitDelivery(event)" style="padding: 25px; max-width: 520px; width: 95%;">
    <div style="text-align:center; margin-bottom:20px; border-bottom:2px solid #f1f5f9; padding-bottom:12px;">
        <div style="font-size:40px;"></div>
        <h3 style="color:var(--primary-dark); margin:5px 0 0 0; text-transform:uppercase; font-weight:900;">Sajili Akaunti ya Usafiri</h3>
        <p style="font-size:11px; color:#64748b; font-weight:bold;">Sokohai Unified Transporter & Fleet Registry</p>
    </div>

    <!-- PART 1: ACCOUNT TYPE & SERVICE SCOPE -->
    <div style="background:#f1f5f9; padding:15px; border-radius:12px; margin-bottom:15px; text-align:left;">
        <b style="font-size:12px; color:var(--primary-dark); text-transform:uppercase; display:block; margin-bottom:8px;">1. Aina ya Akaunti & Huduma</b>
        
        <label style="font-size:11px; font-weight:bold; color:gray;">KICHWA CHA HUDUMA *</label>
        <input type="text" id="delTitle" placeholder="Mfano: Mbeya Express Cargo / Dar-Dodoma Bus" required style="margin-bottom:12px;">

        <label style="font-size:11px; font-weight:bold; color:gray;">AINA YA AKAUNTI (ACCOUNT TYPE) *</label>
        <select id="delAccountType" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; font-weight:bold; margin-bottom:12px;">
            <option value="Individual Driver">Individual Driver (Dereva Binafsi)</option>
            <option value="Vehicle Owner">Vehicle Owner (Mmiliki pekee)</option>
            <option value="Driver + Owner">Driver + Owner (Mmiliki + Dereva)</option>
            <option value="Logistics Company">Logistics Company (Kampuni ya Usafirishaji)</option>
            <option value="Courier Company">Courier Company (Kampuni ya Vifurushi/Parcels)</option>
            <option value="Fleet Company">Fleet Company (Mwenye Magari Mengi)</option>
        </select>

        <label style="font-size:11px; font-weight:bold; color:gray; display:block; margin-bottom:6px;">HUDUMA UNAZOSHUGHULIKIA (TICK ZOTE UTANAZOPRENDA KUBEBA): *</label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; font-size:11px; background:white; padding:10px; border-radius:10px; border:1px solid #cbd5e1;">
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="Passenger" checked> Abiria (Passengers)</label>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="Parcel"> Vifurushi (Parcels)</label>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="Cargo"> Mizigo Mikubwa (Cargo)</label>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="Livestock"> Mifugo Hai (Livestock)</label>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="Agriculture"> Mazao ya Kilimo</label>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="ColdChain"> Dawa/Nyama (Cold Chain)</label>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="Relocation"> Kuhama Nyumba/Ofisi</label>
            <label style="display:flex; align-items:center; gap:6px;"><input type="checkbox" class="del-supported-service" value="HeavyMachinery"> Mitambo Mikubwa</label>
        </div>
    </div>

    <!-- PART 2: VEHICLE REGISTRY -->
    <div style="background:#fffbeb; padding:15px; border-radius:12px; margin-bottom:15px; border:1px solid #fde68a; text-align:left;">
        <b style="font-size:12px; color:var(--primary-dark); text-transform:uppercase; display:block; margin-bottom:8px;">2. Usajili wa Chombo (Vehicle)</b>
        
        <label style="font-size:11px; font-weight:bold; color:gray;">AINA YA CHOMBO *</label>
        <select id="delVehicleType" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; font-weight:bold; margin-bottom:12px;">
            <option value="Bodaboda">Bodaboda (Motorcycle)</option>
            <option value="Bajaji">Bajaji (Tricycle)</option>
            <option value="Taxi">Taxi (Saloon Car)</option>
            <option value="Van">Van / Noah / Hiace</option>
            <option value="Pickup">Pickup / Double Cabin</option>
            <option value="Fuso">Fuso (Medium Truck)</option>
            <option value="Truck">Lori Kubwa (Heavy Truck)</option>
            <option value="Bus">Basi la Abiria (Bus)</option>
            <option value="Trailer">Trailer (Mtego)</option>
        </select>

        <label style="font-size:11px; font-weight:bold; color:gray;">NAMBA YA USAJILI (PLATE NUMBER) *</label>
        <input type="text" id="delVehicleReg" placeholder="Mfano: T 123 ABC" required style="margin-bottom:12px;">

        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
            <div>
                <label style="font-size:11px; font-weight:bold; color:gray;">UWEZO WA MWISHO (KG/TONS) *</label>
                <input type="text" id="delMaxWeight" placeholder="Mf: 5 Tons / 500Kg" required style="margin:0;">
            </div>
            <div>
                <label style="font-size:11px; font-weight:bold; color:gray;">UTAMBULISHO WA RUSH (PRICING) *</label>
                <select id="delPricingMethod" style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; font-weight:bold;">
                    <option value="Fixed">Fixed Price (Trip Moja)</option>
                    <option value="Per KM">Per KM (Kwa Umbali)</option>
                    <option value="Per KG">Per KG (Kwa Uzito)</option>
                    <option value="Negotiable">Negotiable (Maelewano)</option>
                </select>
            </div>
        </div>

        <label style="font-size:11px; font-weight:bold; color:gray;">BEI YA KUANZIA (TSH) *</label>
        <input type="number" id="delBasePrice" placeholder="Mfano: 45,000" required style="margin-bottom:12px;">
    </div>

    <!-- PART 3: ROUTES & REGIONS -->
    <div style="background:#f0fdf4; padding:15px; border-radius:12px; border:1px solid #bbf7d0; margin-bottom:15px; text-align:left;">
        <b style="font-size:12px; color:var(--green); text-transform:uppercase; display:block; margin-bottom:8px;">3. Njia na Maeneo ya Kazi</b>
        
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;">
            <div>
                <label style="font-size:11px; font-weight:bold; color:gray;">MKOA WA KUTOKEA *</label>
                <input type="text" id="delFromRegion" placeholder="Mf: Dar es Salaam" required style="margin:0;">
            </div>
            <div>
                <label style="font-size:11px; font-weight:bold; color:gray;">MKOA WA MWISHO *</label>
                <input type="text" id="delToRegion" placeholder="Mf: Mwanza" required style="margin:0;">
            </div>
        </div>

        <label style="font-size:11px; font-weight:bold; color:gray;">RUTI KAMILI YENYE VITUO VYA NJIANI *</label>
        <input type="text" id="delFullRoute" placeholder="Mf: Dar ➔ Moro ➔ Dom ➔ Singida ➔ Mwanza" required style="margin-bottom:12px;">
    </div>

    <!-- PART 4: OPERATOR / DRIVER INFO -->
    <div style="background:#fff1f2; padding:15px; border-radius:12px; border:1px solid #fecaca; margin-bottom:20px; text-align:left;">
        <b style="font-size:12px; color:var(--terracotta); text-transform:uppercase; display:block; margin-bottom:8px;">4. Taarifa za Dereva & Picha</b>
        
        <label style="font-size:11px; font-weight:bold; color:gray;">JINA LA DEREVA MKUU *</label>
        <input type="text" id="delDriverName" placeholder="Mfano: Juma Athumani" required style="margin-bottom:12px;">

        <label style="font-size:11px; font-weight:bold; color:gray;">NAMBA YA SIMU YA KAZINI *</label>
        <input type="tel" id="delPhone" placeholder="Mfano: 07XXXXXXXX" required style="margin-bottom:12px;">

        <label style="font-size:11px; font-weight:bold; color:gray; display:block; margin-bottom:5px;">MAELEZO YA ZIADA (HIARI)</label>
        <textarea id="delDesc" placeholder="Eleza huduma zako za usafirishaji, ratiba, au masharti maalum..." style="width:100%; height:60px; padding:12px; border-radius:10px; border:1px solid #cbd5e1; margin-bottom:12px; resize:none; outline:none;"></textarea>

        <label style="font-size:11px; font-weight:bold; color:gray; display:block; margin-bottom:5px;">PANDISHA PICHA YA CHOMBO/VEHICLE *</label>
        <input type="file" id="delImage" accept="image/*" required style="background:white; padding:10px; width:100%;">
    </div>

    <button type="submit" id="btnDelivery" style="background:var(--primary-dark); color:white; width:100%; padding:18px; border-radius:14px; font-weight:900; font-size:15px; text-transform:uppercase;"> CHAPISHA SIFARA ZA USAFIRI</button>
    <button type="button" class="btn-close" onclick="goBackToMenu()" style="width:100%; padding:12px; background:#e2e8f0; color:#334155; border:none; border-radius:12px; font-weight:bold; margin-top:10px; cursor:pointer;">❮ Rudi Kwenye Menu</button>
</form>
