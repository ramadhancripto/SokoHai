name: SokoHai CI

# [OPERATIONS 2026-11-08] Langoya kwanza la CI kwa mradi huu.
#
# Kwa nini hii ni muhimu: hadi sasa hakuna kitu kinachozuia mtu kusambaza
# build iliyovunjika, au kusambaza dist/ bila kuipima. Faida zote za
# minification (Awamu D2) zinapotea kimya kimya ikiwa hakuna lango.
#
# Hii ni hatua ya kusoma pekee: hai-deploy, hai-commit, haiandiki kwenye
# Firestore. Inakimbia tu majaribio na uthibitisho.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 1 * * *'   # [PILOT 2026-11-14] E2E ya usiku (04:17 EAT)

# Kama kuna push mpya kwenye tawi lile lile, kimbiza ya zamani inakatishwa.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # 1. Majaribio yote + uthibitisho wa build ya HTML
  # ------------------------------------------------------------------
  test:
    name: Majaribio (npm test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Sakinisha dependencies
        run: npm ci --no-audit --no-fund

      - name: Sakinisha dependencies za functions/
        # functions/ ina package-lock.json yake; `npm ci` ni strict kwa makusudi.
        run: npm --prefix functions ci --no-audit --no-fund

      - name: Endesha majaribio yote
        run: npm test

  # ------------------------------------------------------------------
  # 2. Build ya HTML: html/ -> index.html lazima iwe byte-exact
  # ------------------------------------------------------------------
  build-html:
    name: Build ya HTML (byte-exact)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: '22' }

      - name: 'build_html.py check'
        run: python3 tools/build_html.py check

  # ------------------------------------------------------------------
  # 3. Build ya dist + minification + uthibitisho wa usawa wa token
  #    Hii ndiyo inayolinda Awamu D2 dhidi ya kurudi nyuma.
  # ------------------------------------------------------------------
  dist:
    name: dist + minify + usawa wa token
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Sakinisha dependencies
        run: npm ci --no-audit --no-fund

      - name: Build ya kawaida (bila flag) — lazima ifanye kazi
        run: node tools/build_dist.mjs --check

      - name: Build + minify + uthibitisho wa usawa
        run: node tools/build_dist.mjs --minify --check

      - name: Ripoti ukubwa
        if: always()
        run: |
          echo "### Ukubwa wa dist/js" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist/js 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------
  # 4. [PILOT 2026-11-14] Sheria za Firestore + server kwenye EMULATOR
  #    (demo-sokohai tu: hakuna production, hakuna pesa halisi; PesaPal
  #    inaigwa ndani ya jaribio). Inazuia sheria au malipo kurudi nyuma.
  # ------------------------------------------------------------------
  emulator:
    name: Emulator (sheria + pesa + search)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sakinisha dependencies
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build:shared
          npm install -g firebase-tools@14 --no-audit --no-fund
      - name: Usalama + pesa + search (emulator)
        # Kila kitu cha test:security:all:emulator isipokuwa kichujio cha kategoria (D8, hatua inayofuata).
        run: npm run test:ci:emulator
      - name: Kichujio cha kategoria (D8 — kinasubiri uamuzi wa mmiliki)
        # Inajulikana kushindwa hadi mmiliki aamue ramani ya kategoria (D8).
        # Haizuii merge; inabaki ionekane kwenye ripoti.
        continue-on-error: true
        run: firebase emulators:exec --only firestore --project demo-sokohai "node tools/test_category_filter_emulator.mjs"

  # ------------------------------------------------------------------
  # 5. [PILOT 2026-11-14] Browser E2E kwenye emulator — usiku + kwa mkono
  # ------------------------------------------------------------------
  e2e:
    name: Browser E2E (emulator)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Sakinisha dependencies + browser
        run: |
          npm ci --no-audit --no-fund
          npm --prefix functions ci --no-audit --no-fund
          npm --prefix functions run build:shared
          npm install -g firebase-tools@14 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Endesha E2E
        run: |
          firebase emulators:exec --only firestore,auth --project demo-sokohai '
            (cd functions && FIRESTORE_EMULATOR_HOST=127.0.0.1:8085 FIREBASE_AUTH_EMULATOR_HOST=127.0.0.1:9099 \
              GCLOUD_PROJECT=demo-sokohai SUPER_ADMIN_EMAILS=owner@sokohai.test PORT=5055 node local-server.js > ../local-server.log 2>&1 &) ;
            for i in $(seq 1 30); do curl -sf http://localhost:5055/ >/dev/null && break; sleep 2; done ;
            bash tools/e2e-emulator/run.sh'
      - name: Hifadhi picha na matokeo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            tools/e2e-emulator/out/
            local-server.log
          retention-days: 7
