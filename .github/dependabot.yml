# [OPERATIONS 2026-11-08] Dependabot: taarifa za kiotomatiki kuhusu
# dependencies zilizo na matoleo mapya au dosari za usalama.
# Hai-merge chochote — inafungua PR za kukaguliwa na mmiliki.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /functions
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 3
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
