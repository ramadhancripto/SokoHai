<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>SokoHai Admin</title>
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/fonts/inter.css">
<link rel="stylesheet" href="/css/admin-portal.css?v=20261122ap2">
<script src="/shared/ui-text.js?v=20261121ui1"></script>
<script src="/js/05-dialogs.js"></script>
<script src="/js/05-local-avatars.js"></script>
<script src="/js/00-config.js"></script>
</head>
<body class="ap-body">
<!-- [ADMIN PORTAL 2026-11-21] Separate administration application (admin.sokohai.com -> /admin/).
     Its own sign-in (no registration), the shared backend (same Firebase project, rules and Cloud Functions).
     Access is decided by the SERVER: ID-token claims (admin / superAdmin / role) checked again by Firestore rules
     and by every admin Cloud Function; this page only hides what the server would refuse anyway. -->
<div id="apLogin" class="ap-login" hidden>
  <form id="apLoginForm" class="ap-card" autocomplete="on" novalidate>
    <div class="ap-brand"><img src="/assets/img/sokohai-app-192-v3.png" alt="" width="40" height="40"><div><b>SokoHai</b><small data-ap-t="brand_sub">Kituo cha Utawala</small></div></div>
    <h1 data-ap-t="login_h">Ingia kama msimamizi</h1>
    <p class="ap-muted" data-ap-t="login_note">Akaunti za wasimamizi huundwa na Super Admin pekee. Hakuna usajili hapa.</p>
    <label for="apEmail" data-ap-t="email">Barua pepe</label>
    <input id="apEmail" type="email" autocomplete="username" required>
    <label for="apPass" data-ap-t="password">Nenosiri</label>
    <input id="apPass" type="password" autocomplete="current-password" required>
    <button type="submit" class="ap-btn" id="apSignIn" data-ap-t="sign_in">Ingia</button>
    <button type="button" class="ap-btn ap-btn--ghost" id="apGoogle" data-ap-t="google">Ingia kwa Google</button>
    <p id="apLoginMsg" class="ap-msg" role="alert"></p>
    <p class="ap-muted ap-small"><a href="/" data-ap-t="back">Rudi sokoni</a> · <button type="button" class="ap-lang" data-ap-lang aria-label="Language / Lugha">English</button></p>
  </form>
</div>
<div id="apApp" class="ap-app" hidden>
  <header class="ap-top">
    <div class="ap-brand"><img src="/assets/img/sokohai-app-192-v3.png" alt="" width="32" height="32"><div><b>SokoHai Admin</b><small id="apRole"></small></div></div>
    <button type="button" class="ap-menu-btn" id="apMenuBtn" aria-label="Menyu" data-ap-t-aria="menu" aria-expanded="false">☰</button>
    <div class="ap-who"><span id="apWho"></span><button type="button" class="ap-lang" data-ap-lang aria-label="Language / Lugha">English</button><button type="button" class="ap-btn ap-btn--ghost ap-btn--sm" id="apSignOut" data-ap-t="sign_out">Toka</button></div>
  </header>
  <div class="ap-shell">
    <nav id="apNav" class="ap-nav" aria-label="Sehemu za utawala" data-ap-t-aria="nav"></nav>
    <main id="apMain" class="ap-main" tabindex="-1"></main>
  </div>
</div>
<div id="apBoot" class="ap-boot" data-ap-t="loading">Inapakia…</div>
<script type="module" src="/js/admin/portal.js?v=20261122ap2"></script>
</body>
</html>
