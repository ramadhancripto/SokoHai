# [REPAIR 2026-10 C5] Publish ONLY the public allow-list built into dist/.
# The repository root holds server code, tests, reports and seed scripts that
# must never be served. `--check` fails the deploy if a forbidden file appears.
[build]
  # [AWAMU D2 2026-11-08] Minification imeunganishwa hapa: build + check + uthibitisho
  # wa usawa wa token. Kama uthibitisho unashindwa, deploy inakatishwa.
  # Kurudi nyuma ni mstari mmoja: node tools/build_dist.mjs --check
  command = "node tools/build_dist.mjs --minify --check"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(self), payment=(self)"
    # [SECURITY 2026-11-08] HSTS ilikuwa haipo. Netlify inatoa HTTPS; header hii
    # inailazimisha kwa miaka 2 na inajumuisha subdomains.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # [SECURITY 2026-11-08] CSP haijawekwa kwa makusudi: index.html ina 400+
    # inline handler (onclick="..."). script-src 'self' ingevunja mfumo mzima.
    # CSPReportOnly inaweza kuwekwa baadaye baada ya kuhamisha handlers.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sokohai-sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/fonts/sokohai-sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/js/app/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# The repository previously contained a second stale application under /fonts/.
# Old bookmarks and service-worker-controlled requests must return to one root app.
[[redirects]]
  from = "/fonts/js/*"
  to = "/js/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fonts/css/*"
  to = "/css/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fonts/html/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fonts/"
  to = "/"
  status = 301
  force = true

# Server-only code & secrets must never be public (functions/ may hold a local
# service-account.json for the local functions server).
[[redirects]]
  from = "/functions/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/service-account*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
