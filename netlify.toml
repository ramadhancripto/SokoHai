# [REPAIR 2026-10 C5] Publish ONLY the public allow-list built into dist/.
# The repository root holds server code, tests, reports and seed scripts that
# must never be served. `--check` fails the deploy if a forbidden file appears.
[build]
  # [AWAMU D2 2026-11-08] Minification imeunganishwa hapa: build + check + uthibitisho
  # wa usawa wa token. Kama uthibitisho unashindwa, deploy inakatishwa.
  # Kurudi nyuma ni mstari mmoja: node tools/build_dist.mjs --check
  # [SEO 2026-11-21] then the crawlable public pages + sitemaps (tools/build_seo.mjs). [SEO-SAFETY] In PRODUCTION a
  # listing-data read failure FAILS the build, so Netlify keeps the last good deploy (an empty catalogue is not a failure).
  # Deploy previews / branch deploys build static pages only.
  command = "node tools/build_dist.mjs --minify --check && node tools/build_seo.mjs --out dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(self), payment=(self)"
    # [SECURITY 2026-11-08] HSTS ilikuwa haipo. Netlify inatoa HTTPS; header hii
    # inailazimisha kwa miaka 2 na inajumuisha subdomains.
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # [SECURITY 2026-11-08] CSP haijawekwa kwa makusudi: index.html ina 400+
    # inline handler (onclick="..."). script-src 'self' ingevunja mfumo mzima.
    # CSPReportOnly inaweza kuwekwa baadaye baada ya kuhamisha handlers.

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/sokohai-sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/fonts/sokohai-sw.js"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/js/app/*"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# The repository previously contained a second stale application under /fonts/.
# Old bookmarks and service-worker-controlled requests must return to one root app.
# [ADMIN PORTAL 2026-11-21] admin.sokohai.com opens the separate admin application. Only the root is rewritten:
# its scripts and styles (/js, /css, /shared, /fonts) are the same files as the marketplace. Owner action: add
# admin.sokohai.com as a Netlify domain alias and to Firebase Auth "Authorized domains".
[[redirects]]
  from = "https://admin.sokohai.com/"
  to = "/admin/"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[redirects]]
  from = "/fonts/js/*"
  to = "/js/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fonts/css/*"
  to = "/css/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/fonts/html/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/fonts/"
  to = "/"
  status = 301
  force = true

# Server-only code & secrets must never be public (functions/ may hold a local
# service-account.json for the local functions server).
[[redirects]]
  from = "/functions/*"
  to = "/index.html"
  status = 404
  force = true

[[redirects]]
  from = "/service-account*"
  to = "/index.html"
  status = 404
  force = true

# [SEO 2026-11-21] Public page sections are static files. A page that does not exist (sold / removed listing, typo)
# gets a real 404 instead of the app shell with 200 ("soft 404"). Not forced: existing pages are served first.
[[redirects]]
  from = "/bidhaa/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/huduma/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/duka/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/soko/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/chapa/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/mwongozo/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/sitemap*.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
