<!-- FOMU YA AGENT -->
    <form id="agentForm" class="form-box">
        <h3> Jiunge Kuwa Wakala</h3>
        <input type="text" id="agentName" placeholder="Jina Kamili *">
        <input type="tel" id="agentPhone" placeholder="Namba ya Simu *">
        <input type="email" id="agentEmail" placeholder="Barua Pepe (Hiari)">
        <select id="agentRegion">
            <option value="">Chagua Mkoa wako *</option>
            <option value="Dar es Salaam">Dar es Salaam</option>
            <option value="Arusha">Arusha</option>
            <option value="Mwanza">Mwanza</option>
            <option value="Mbeya">Mbeya</option>
            <option value="Dodoma">Dodoma</option>
        </select>
        <textarea id="agentBio" placeholder="Eleza Uzoefu wako kwa ufupi *"></textarea>
        <label>Picha Yako (Iwe Rasmi):</label>
        <input type="file" id="agentPhoto" accept="image/*" style="background:white;">
        <button type="submit" id="btnAgent" onclick="submitAgent()" style="background:var(--gold);color:var(--primary-dark);"> TUMA OMBI LAKO</button>
        <button type="button" class="btn-close" onclick="goBackToMenu()">&lsaquo; Rudi Nyuma</button>
    </form>

<!--  FOMU MPYA YA SOKOHAI HUDUMA HUB -->
<form id="serviceForm" class="form-box" onsubmit="window.submitSokohaiService(event)">
    <h3 style="color:var(--primary-dark); font-weight:900; text-align:center; margin-top:0;"> Sajili Huduma Mpya</h3>
    
<label style="font-size:12px; font-weight:bold;">Aina ya Kundi la Huduma *</label>
<select id="servGroupType" onchange="window.updateHubCategories()" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; margin-bottom:12px;">
    <option value="">-- Chagua Kundi --</option>
    <option value="physical"> Physical Services (Mitaani / Nyumbani)</option>
    <option value="online"> Online Services (Mtandaoni / Remote)</option>
    <option value="food"> Food Services (Vyakula & Migahawa)</option>
    <option value="rental"> Rental Services (Ukodishaji)</option>
</select>

<label style="font-size:12px; font-weight:bold;">Kategoria ya Huduma *</label>
<select id="servHubCategory" onchange="window.updateHubSubcategories()" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; margin-bottom:12px;">
    <option value="">-- Chagua Kategoria --</option>
</select>

<label style="font-size:12px; font-weight:bold;">Aina Ndogo (Subcategory) *</label>
<select id="servHubSubCategory" onchange="window.generateHubServiceFilters()" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; margin-bottom:12px;">
    <option value="">-- Chagua Aina Ndogo --</option>
</select>

    <!-- [AUDIT-FIX 2026-09-16 P1 §service-form]: NAKALA ya subcategory select
         (same id="servHubSubCategory") IMEONDEOLEWA. Ilisababisha select ya
         pili KUBAKIA tupu (<select></select>) na kadhalika gongo la
         "Patupu / subcategory inalazimika" — huko updateHubSubcategories ina
         jaza tu kipengele cha kwanza cha duplicate id. -->

    <div id="hubServiceFiltersBox" style="background:#f8fafc; padding:10px; border-radius:10px; margin-bottom:12px; display:none; border:1px solid #e2e8f0;">
        <b style="font-size: 13px; color:var(--primary-dark);">Jaza Vigezo vya Huduma</b>
        <div id="hubServiceFiltersArea"></div>
    </div>

    <label style="font-size:12px; font-weight:bold;">Kichwa cha Huduma yako *</label>
    <input type="text" id="servHubTitle" placeholder="Mfano: House Wiring / Kioo cha iPhone Repair" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label style="font-size:12px; font-weight:bold;">Gharama ya Huduma / Bajeti (TSh) *</label>
    <input type="number" id="servHubPrice" placeholder="Mfano: 80,000" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; margin-bottom:12px;">

    <label style="font-size:12px; font-weight:bold;">Mfumo wa Bei</label>
    <select id="servPricingModel" style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; margin-bottom:12px;">
        <option value="fixed">Bei kamili (fixed)</option>
        <option value="starting">Kuanzia</option>
        <option value="hourly">Kwa saa</option>
        <option value="per_job">Kwa kazi</option>
        <option value="per_day">Kwa siku</option>
        <option value="per_unit">Kwa kipimo</option>
        <option value="negotiable">Inajadiliwa</option>
        <option value="quotation_required">Kadirio linahitajika</option>
    </select>

    <label style="font-size:12px; font-weight:bold;">Upatikanaji (hiari)</label>
    <select id="servAvailability" style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; background:white; margin-bottom:12px;">
        <option value="">Haujaainishwa</option>
        <option value="available">Inapatikana</option>
        <option value="available_today">Inapatikana leo</option>
        <option value="appointment_required">Miadi inahitajika</option>
    </select>

    <label style="font-size:12px; font-weight:bold;">Maelezo ya Huduma yako *</label>
    <textarea id="servHubDesc" placeholder="Eleza kwa ufupi jinsi unavyotoa huduma hii kwa wateja..." required style="width:100%; height:70px; padding:12px; border-radius:10px; border:1px solid #cbd5e1; margin-bottom:12px; resize:none;"></textarea>

    <label style="font-size:12px; font-weight:bold;">Picha ya Kazi yako (Ushahidi) *</label>
    <input type="file" id="servHubImage" accept="image/*" style="background:white; padding:10px; width:100%; border:1px solid #cbd5e1; border-radius:10px; margin-bottom:12px;">

    <label style="font-size:12px; font-weight:bold;">Eneo unakopatikana / Kazi Inapofanyika *</label>
    <input type="text" id="servHubLocation" placeholder="Mfano: Kimara / Mikocheni, DSM" required style="width:100%; padding:12px; border-radius:10px; border:1px solid #cbd5e1; margin-bottom:15px;">

    <div style="background:#f0fdf4; padding:12px; border-radius:10px; border:1px solid #bbf7d0; margin-bottom:12px; text-align:left;">
        <label style="display:flex; gap:10px; align-items:flex-start; font-size:13px; color:#14532d; cursor:pointer;">
            <input type="checkbox" id="servTravelAvailable" style="margin-top:2px; width:18px; height:18px;">
            <span><b>Ninaweza kusafiri kwenda eneo la mteja</b><br><small>Chagua tu ikiwa uwezo huu ni wa kweli. Discover haitakadiria umbali au njia.</small></span>
        </label>
    </div>

    <!-- [NEGO LOCK §21/§22] Provider Settings: mtoa huduma anachagua kama
         mteja anaweza kupana bei (negotiation) ama hapana. Default ON. -->
    <div style="background:#eff6ff; padding:12px; border-radius:10px; border:1px solid #bfdbfe; margin-bottom:15px; text-align:left;">
        <label style="display:flex; align-items:flex-start; gap:10px; font-size:13px; color:#1e3a5f; cursor:pointer;">
            <input type="checkbox" id="servNegoAllowed" checked style="margin-top:2px; width:18px; height:18px; flex-shrink:0;">
            <span><b>Ruhusu negotiation ya bei</b><br><small style="color:#475569;">Mteja anaweza kupendekeza bei tofauti. Ukizima, bei yako iliyotangazwa ndiyo sahihi (chat inabaki).</small></span>
        </label>
    </div>

    <button type="submit" id="btnSubmitHubService" style="background:var(--primary-blue); color:white; width:100%; padding:16px; border-radius:14px; font-weight:900; border:none; cursor:pointer; text-transform:uppercase;"> CHAPISHA HUDUMA</button>
    <button type="button" class="btn-close" onclick="window.goBackToMenu()" style="width:100%; padding:12px; background:#e2e8f0; color:#334155; border:none; border-radius:12px; font-weight:bold; margin-top:10px; cursor:pointer;">&lsaquo; Rudi Nyuma</button>
</form>
